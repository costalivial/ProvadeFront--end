<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar novo usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h2>Cadastrar usuario-ENEM</h2>
        <p class="subtitulo">Preencha com os seus dados</p>
    </header>

    <div class="container" style="max-width: 450px;">
        <form id="form-cadastro">
                
            <div class="form-group">
                <label for="cad-nome">Nome Completo:</label>
                <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="cadastro-email">E-mail:</label>
                <input type="email" id="cadastro-email" placeholder="exemplo@email.com" required>
            </div>
        
            <div class="form-row">
                <div class="form-group">
                    <label for="cad-telefone">Telefone:</label>
                    <input type="tel" id="cad-telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                </div>

                <div class="form-group">
                    <label for="cad-mae">Nome da Mãe:</label>
                    <input type="text" id="cad-mae" placeholder="Digite o nome da sua mãe" required>
                </div>

                <div class="form-group">
                    <label for="cad-pai">Nome do pai:</label>
                    <input type="text" id="cad-pai" placeholder="Digite o nome do seu pai" required>
                </div>
            </div>

            <hr>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="end-rua">Rua / Avenida</label>
                    <input type="text" id="end-rua" placeholder="Av. Paulista" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="end-numero">Número</label>
                    <input type="text" id="end-numero" placeholder="123" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="end-cidade">Cidade</label>
                    <input type="text" id="end-cidade" placeholder="São Paulo" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="end-estado">Estado:</label>
                    <select id="end-estado" required>
                        <option value="">Selecione</option>
                        <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                        <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                        <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                        <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                        <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                        <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                        <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                        <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                        <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="end-pais">Pais:</label>
                    <select id="end-pais" required>
                        <option value="">Selecione</option>
                        <option value="BR">Brasil</option><option value="IN">Inglaterra</option><option value="I">Índia</option>
                        <option value="EUA">Estados Unidos</option><option value="A">Alemanha</option><option value="NZ">Nova Zelândia</option>
                        <option value="M">Mexico</option><option value="CH">China</option><option value="AS">Arábia Saudita</option>
                        <option value="IT">Italia</option><option value="JA">Japão</option><option value="CA">Canadá</option>
                        <option value="PORT">Portugal</option><option value="CV">Cabo verde</option><option value="EG"> Egito</option>
                        <option value="FR">França</option><option value="H">Haiti</option><option value="NI">Nigéria</option>
                        <option value="Ar">Argentina</option><option value="S">Senegal</option><option value="Q">Quênia.</option>
                        <option value="EQ">Equador</option><option value="ES">Espanha</option><option value="AN">Angola</option>
                        <option value="CO">Colombia</option><option value="AU">Austrália</option><option value="ADS">África do Sul</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="flex: 1;">
                <label for="situacao-ensino">Situação do ensino médio:</label>
                <select id="situacao-ensino" required>
                    <option value="">Selecione</option>
                    <option value="cursando">Estou cursando</option>
                    <option value="concluido">Já conclui</option>
                </select>
            </div>

            <div class="form-group" style="flex: 1;">
                <label for="tipo-escola">Tipo de escola:</label>
                <select id="tipo-escola" required>
                    <option value="">Selecione</option>
                    <option value="publica">Escola Pública</option>
                    <option value="privada">Escola Privada</option>
                </select>
            </div>          

            <div class="form-group">
                <label for="cadastro-senha">Senha:</label>
                <input type="password" id="cadastro-senha" minlength="8" pattern="^(?=.*[A-Z]).{8,}$" placeholder="com 8 caracteres e 1 Maiuscula" required>
            </div>

            <div class="form-group">
                <label for="cadastro-Csenha">Confirmar senha:</label>
                <input type="password" id="cadastro-Csenha" minlength="8" pattern="^(?=.*[A-Z]).{8,}$" placeholder="8 caracteres e 1 letra Maiuscula" required>
            </div>

            <button type="submit" class="btn-submit">Salvar inscrição</button>
            <button type="button" class="btn" onclick="window.location.href='index.html'">Voltar</button>
        </form>
    </div>

    <footer class="rodape">
        <p>costa©livia 2026-ENEM</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
