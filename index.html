<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do candidato 2026-ENEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h2>Portal do candidato-ENEM</h2>
        <p class="subtitulo">Preencha seu login</p>
    </header>

    <div class="container" style="max-width: 450px;">
        <form id="form-index">
            <div class="form-group">
                <label for="index-email">E-mail:</label>
                <input type="email" id="index-email" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="index-senha">Senha:</label>
                <input type="password" id="index-senha" minlength="8" pattern="^(?=.*[A-Z]).{8,}$" placeholder="8 caracteres e 1 letra Maiuscula" required>
            </div>
        
            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <br>
        <footer class="login-footer">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>.</p>
        </footer>
    </div>
    
    <footer class="rodape">
        <p>costa©livia 2026-ENEM</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
